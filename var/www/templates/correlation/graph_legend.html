<details id="correlation-graph-legend" class="correlation-graph-legend" open hidden>
    <summary>{% if compact_legend %}Select by type{% else %}Legend{% endif %}</summary>
    <div class="correlation-legend-help">
        <span>Click an object type to select all its objects. Hold Ctrl, Cmd or Shift to add to the selection.</span>
        <button type="button" class="correlation-legend-clear" data-legend-clear {% if compact_legend %}hidden{% endif %}>Clear selection</button>
    </div>
    <div class="correlation-legend-types" data-legend-types role="group" aria-label="Select objects by type"></div>
</details>
