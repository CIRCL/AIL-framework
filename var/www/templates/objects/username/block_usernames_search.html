<div class="card border-secondary shadow-sm my-3">
    <div class="card-body text-dark px-3 px-md-4 py-3">
        <div class="d-flex align-items-center border-bottom pb-2 mb-3">
            <div class="rounded-circle bg-light text-primary p-2 mr-3" aria-hidden="true">
                <i class="fas fa-user fa-lg"></i>
            </div>
            <div>
                <h5 class="mb-1">Search usernames</h5>
                <p class="text-muted mb-0">Find a username across all types, or focus on one platform.</p>
            </div>
        </div>
        <form action="{{ url_for('search_b.search_dashboard') }}" id="username_search_form" method="get" role="search" aria-label="Search usernames" autocomplete="off">
            <input type="hidden" name="scopes" value="username">
            <div class="form-row align-items-end">
                <div class="form-group col-md-9 mb-2">
                    <label for="username_search_query" class="font-weight-bold">Username</label>
                    <input type="search" id="username_search_query" class="form-control form-control-lg" name="q" value="{% if to_search %}{{ to_search }}{% endif %}" placeholder="e.g. alice" aria-describedby="username_search_help" autocomplete="off" spellcheck="false" data-lpignore="true" data-1p-ignore required>
                </div>
                <div class="form-group col-md-3 mb-2">
                    <button type="submit" class="btn btn-primary btn-lg btn-block">
                        <i class="fas fa-search mr-2" aria-hidden="true"></i>Search
                    </button>
                </div>
            </div>
            <div class="bg-light rounded border-top px-3 py-2 mt-1">
                <h6 class="text-muted mb-2">Search options</h6>
                <div class="form-row">
                    <div class="form-group col-sm-6 col-lg-4 mb-lg-0">
                        <label for="username_search_type" class="font-weight-bold mb-1">Username type</label>
                        <select id="username_search_type" class="custom-select" name="username_types">
                            <option value="" {% if not subtype or subtype == 'all' %}selected{% endif %}>All types</option>
                            {% for s in subtypes %}
                                <option value="{{ s }}" {% if s == subtype %}selected{% endif %}>{{ s }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <small id="username_search_help" class="text-muted d-block mt-2">Results open in global search, where you can expand the search scope.</small>
            </div>
        </form>
    </div>
</div>
