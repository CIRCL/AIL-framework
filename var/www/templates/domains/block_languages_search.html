<form class="surface search-surface domain-language-form" action="{{ url_for('crawler_splash.domains_search_languages_get') }}" method="get" role="search" aria-label="Search domains by language">
    <div class="language-query">
        <label for="domain-languages">Languages</label>
        <div class="language-picker">
            <input type="text" class="form-control" id="domain-languages" name="languages" value="{{ current_languages|join(',') }}" data-choices='{{ language_choices|tojson }}' placeholder="Select languages…" autocomplete="off">
            <button class="btn btn-outline-secondary" type="button" id="clear-domain-languages" hidden>Clear</button>
        </div>
    </div>
    <fieldset class="search-networks">
        <legend>Networks</legend>
        <div class="search-network-options">
            {% for network, label, icon in [('onion', 'Onion', 'user-secret'), ('i2p', 'I2P', 'user-secret'), ('web', 'Web', 'globe')] %}
                <div class="search-network-choice">
                    <input type="checkbox" class="search-network-input" id="language-network-{{ network }}" name="domain_types" value="{{ network }}"{% if network in domains_types %} checked{% endif %}>
                    <label for="language-network-{{ network }}"><i class="fas fa-{{ icon }}" aria-hidden="true"></i>{{ label }}<i class="fas fa-check network-selected-mark" aria-hidden="true"></i></label>
                </div>
            {% endfor %}
        </div>
    </fieldset>
    <button class="btn btn-primary search-submit" type="submit">Search<i class="fas fa-arrow-right ml-2" aria-hidden="true"></i></button>
    <p class="language-search-error text-danger small mb-0" id="language-search-error" role="alert" hidden>Select at least one language.</p>
</form>
