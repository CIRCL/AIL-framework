<!DOCTYPE html>
<html>
<head>
    <title>Vanity Explorer - AIL</title>
	<link rel="icon" href="{{ url_for('static', filename='image/ail-icon.png') }}">
	<!-- Core CSS -->
	<link href="{{ url_for('static', filename='css/bootstrap4.min.css') }}" rel="stylesheet">
	<link href="{{ url_for('static', filename='css/font-awesome.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/dataTables.bootstrap.min.css') }}" rel="stylesheet">
	<!-- JS -->
	<script src="{{ url_for('static', filename='js/jquery.js')}}"></script>
    <script src="{{ url_for('static', filename='js/popper.min.js')}}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap4.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/jquery.dataTables.min.js')}}"></script>
	<script src="{{ url_for('static', filename='js/dataTables.bootstrap.min.js')}}"></script>

    <style>
        .card-columns {
            column-count: 4;
        }
    </style>

</head>
<body>

	{% include 'nav_bar.html' %}

	<div class="container-fluid">
		<div class="row">


			<div class="col-12" id="core_content">

                <h1><i class="fas fa-dumbbell"></i> Vanity Explorer</h1>

                <table id="tableClusters" class="table">
                    <thead class="bg-dark text-white">
                    <tr>
                        <th>Vanity</th>
                        <th>NB Domains</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody style="font-size: 15px;">
                    {% for row in vanity_clusters %}
                        <tr>
                            <td>
                                <a href="{{ url_for('crawler_splash.domains_explorer_vanity_explore') }}?vanity={{row[0]}}&length={{ length }}">{{ row[0] }}</a>
                            </td>
                            <td>{{ row[1] | int }}</td>
                            <td>

                            </td>
                        </tr>
                    {% endfor %}
                    </tbody>
                </table>


			</div>
		</div>
	</div>
</body>


<script>
  $(document).ready(function(){
    $('#page-Crawler').addClass('active');
    $('#crawler-nav-explorers-toggle').addClass('active');
    $("#crawler-nav-vanity-explorer").addClass("active");
    $('#tableClusters').DataTable({
        "aLengthMenu": [[5, 10, 15, -1], [5, 10, 15, "All"]],
        "iDisplayLength": 10,
        "order": [[ 1, "desc" ]]
    });

  });

</script>

</html>
