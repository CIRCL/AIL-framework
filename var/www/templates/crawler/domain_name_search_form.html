<form class="domain-name-form" action="{{ url_for('crawler_splash.domains_search_name') }}" method="get" role="search" aria-label="Search domains by name">
    <div class="domain-query-row">
        <div class="domain-query-field">
            <label for="domain-name-query" class="{{ 'domain-query-label' if show_query_label else 'sr-only' }}">Domain name</label>
            <div class="domain-query-input">
                <i class="fas fa-search domain-query-icon" aria-hidden="true"></i>
                <input type="search" class="form-control" id="domain-name-query" name="name" value="{{ search_name }}" placeholder="Search a domain (example.org) or part of one (example)" required>
            </div>
        </div>
        <button class="btn btn-primary search-submit" type="submit">Search<i class="fas fa-arrow-right ml-2" aria-hidden="true"></i></button>
    </div>
    <fieldset class="search-networks">
        <legend>Networks</legend>
        <div class="search-network-options">
            {% for network, label, icon in [('onion', 'Onion', 'user-secret'), ('i2p', 'I2P', 'user-secret'), ('web', 'Web', 'globe')] %}
                <div class="search-network-choice">
                    <input type="checkbox" class="search-network-input" id="name-network-{{ network }}" name="domain_types" value="{{ network }}"{% if network in selected_networks %} checked{% endif %}>
                    <label for="name-network-{{ network }}"><i class="fas fa-{{ icon }}" aria-hidden="true"></i>{{ label }}<i class="fas fa-check network-selected-mark" aria-hidden="true"></i></label>
                </div>
            {% endfor %}
        </div>
    </fieldset>
    <p class="domain-name-search-error text-danger small mb-0 mt-2" role="alert" hidden>Enter a domain name and select at least one network.</p>
</form>
